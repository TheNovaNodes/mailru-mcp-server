name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true # FinOps: cancel redundant runs

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # FinOps: Hard limit
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1 # FinOps: shallow clone
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true
        
    - name: Verify dependencies
      run: |
        go mod download
        go mod verify
        
    - name: Go Vet
      run: |
        go vet ./...

    - name: Run Unit Tests with Race and Coverage
      run: |
        go test -v -race -cover ./internal/...

    - name: Build Binary
      run: |
        go build -v -o mailru-mcp-server .
