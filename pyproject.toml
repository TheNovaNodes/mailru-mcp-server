[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mailru-mcp-server"
version = "1.2.0"
description = "Model Context Protocol (MCP) Server for Mail.ru IMAP, SMTP, and WebDAV"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "TheNovaNodes Collective" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "imap-tools>=1.6.0",
    "webdavclient3>=3.14.6",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/TheNovaNodes/mailru-mcp-server"
Repository = "https://github.com/TheNovaNodes/mailru-mcp-server"
Issues = "https://github.com/TheNovaNodes/mailru-mcp-server/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 95
